# M7 recommendation rules.
#
# when:     boolean expression over the metrics namespace (see below). A rule whose inputs are missing
#           (analyzer unavailable) simply does not fire.
# item:     optional. Bind ONE region so the message can name it: {from: <region type>, where: <expr>,
#           pick: max|min, by: <expr>}. Region fields are available as item_<field> (item_text,
#           item_height_pct, item_contrast, item_mobile_readable, item_attention_pct, item_emotion,
#           item_intensity, item_subject_overlap, item_area ...).
# severity: high | medium | low, or an expression returning one of those (quote the strings: 'high' if x > 3 else 'medium').
# impact:   expression, clipped to 0..1 (default 0.5). Fixes are ranked by severity weight x impact.
# message:  str.format template, filled with the same namespace. Always include the real numbers.
#
# Namespace: every numeric metric as <group>_<name> (e.g. text_area_pct, composition_ui_overlap_pct,
# face_largest_area_pct), scores_<name>, the constants below, and focal_labels.
# Expressions may use + - * / comparisons, and/or/not, `a if c else b`, and min/max/abs/round/len.

constants:
  readable_height_pct: 12     # text this tall (% of frame height) survives the 168 px sidebar render
  large_text_contrast_min: 3.0  # WCAG AA for large text; thumbnail text is almost always 'large' (24 px+ at 1280 wide)
  max_words: 5
  max_text_area: 25
  target_face_pct: 8
  typical_punch: 22           # typical light/dark spread (std of lightness) in decent thumbnails
  ui_overlap_limit: 4

max_recommendations: 5
min_recommendations: 2

rules:
  # ---------------- text ----------------
  - id: text_unreadable_mobile
    severity: high
    item: {from: text, where: "not item_mobile_readable and item_subject_overlap < 0.7 and item_height_pct < readable_height_pct and item_attention_pct >= 1", pick: max, by: item_area}
    impact: "min(1, 0.45 + item_attention_pct / 20)"
    message: 'The text "{item_text}" is {item_height_pct:.0f}% of the frame height and disappears at sidebar size (168 px wide). Make it at least {readable_height_pct:.0f}% tall or cut other words so it can grow.'

  - id: text_font_unreadable
    severity: medium
    item: {from: text, where: "not item_mobile_readable and item_subject_overlap < 0.7 and item_height_pct >= readable_height_pct and item_attention_pct >= 1", pick: max, by: item_area}
    impact: "min(1, 0.4 + item_attention_pct / 25)"
    message: 'The text "{item_text}" is large ({item_height_pct:.0f}% of the frame height) yet unreadable at sidebar size, which usually means a thin, ornate or low-contrast font. Use a bolder, simpler typeface with an outline.'

  - id: text_low_contrast
    severity: "'high' if item_contrast < 2.0 else 'medium'"
    item: {from: text, where: "item_contrast is not None and item_contrast < large_text_contrast_min and item_height_pct >= 5 and item_attention_pct >= 1", pick: max, by: item_area}
    impact: "min(1, (large_text_contrast_min - item_contrast) / large_text_contrast_min + 0.3)"
    message: 'Contrast on "{item_text}" is only {item_contrast:.1f}:1 (WCAG asks for at least {large_text_contrast_min:.0f}:1 even for large text). Add a dark outline or shadow, or recolour it against a plainer background.'

  - id: too_many_words
    severity: medium
    when: "text_word_count > max_words"
    impact: "min(1, (text_word_count - max_words) / 8 + 0.3)"
    message: 'There are {text_word_count:.0f} words on the thumbnail. Cut it to {max_words} or fewer so the message reads in a glance.'

  - id: text_covers_too_much
    severity: medium
    when: "text_area_pct > max_text_area"
    impact: "min(1, (text_area_pct - max_text_area) / 20 + 0.3)"
    message: 'Text covers {text_area_pct:.0f}% of the frame (aim for under {max_text_area}%). Shorten it or shrink the secondary lines so the image can breathe.'

  # ---------------- faces ----------------
  - id: face_too_small
    severity: medium
    when: "face_count >= 1 and face_largest_area_pct < 3"
    impact: "min(1, (3 - face_largest_area_pct) / 3 + 0.35)"
    message: 'The largest face fills only {face_largest_area_pct:.1f}% of the frame and draws {attention_share_face:.0f}% of attention. Crop in or enlarge it toward {target_face_pct}%.'

  - id: face_flat_expression
    severity: low
    item: {from: face, where: "item_intensity is not None and item_intensity < 0.25 and item_area > 20000", pick: max, by: item_area}
    impact: "0.7 - item_intensity"
    message: 'The main face has a low-intensity expression ({item_intensity:.2f} of 1; the model reads it as {item_emotion}). A clearer, stronger expression earns more attention in this model.'

  # ---------------- focus and composition ----------------
  - id: competing_focal_points
    severity: "'high' if composition_focal_points >= 7 else 'medium'"
    when: "composition_focal_points >= 6"
    impact: "min(1, (composition_focal_points - 4) / 4 + 0.2)"
    message: 'Attention splits across {composition_focal_points:.0f} spots: {focal_labels}. Pick one hero element and mute or shrink the others.'

  - id: weak_primary_focus
    severity: medium
    when: "composition_top_peak_ratio > 0.85 and composition_concentration_top10 < 0.3"
    impact: "min(1, composition_top_peak_ratio - 0.3)"
    message: 'No single element wins: the second-strongest attention peak is {composition_top_peak_ratio:.0%} as strong as the first. Make the main subject larger, brighter or higher-contrast than everything else.'

  - id: attention_under_ui
    severity: medium
    when: "composition_ui_overlap_pct > ui_overlap_limit"
    impact: "min(1, composition_ui_overlap_pct / 12 + 0.3)"
    message: '{composition_ui_overlap_pct:.0f}% of attention falls under the duration badge or progress bar (bottom-right corner and bottom edge). Move key content out of that area.'

  - id: low_contrast_image
    severity: medium
    when: "color_lightness_contrast < 14"
    impact: "min(1, (14 - color_lightness_contrast) / 10 + 0.3)"
    message: 'The image is flat: its light/dark spread is {color_lightness_contrast:.0f} (typically above {typical_punch}). Add contrast, for example a darker backdrop behind a light subject.'

  - id: empty_frame
    severity: medium
    when: "composition_negative_space_pct > 65"
    impact: "min(1, (composition_negative_space_pct - 60) / 30 + 0.3)"
    message: 'About {composition_negative_space_pct:.0f}% of the frame is empty. Scale the main subject up so it fills more of the canvas.'

  - id: cramped_background
    severity: low
    when: "composition_negative_space_pct < 12 and composition_peak_count >= 6"
    impact: "min(1, (composition_peak_count - 5) / 4 + 0.2)"
    message: 'Only {composition_negative_space_pct:.0f}% of the frame is calm and there are {composition_peak_count:.0f} attention peaks. Simplify or blur the background so the subject stands out.'

  # ---------------- subject and colour ----------------
  - id: subject_blends_in
    severity: medium
    when: "subject_has_clear_subject == 1 and subject_edge_contrast < 25"
    impact: "min(1, (25 - subject_edge_contrast) / 25 + 0.3)"
    message: 'The main subject (about {subject_area_pct:.0f}% of the frame) barely stands out from what is right behind it: the colour difference at its outline is {subject_edge_contrast:.0f} (30 or more is a clear edge). Add a rim light or outline, or shift or blur the background.'

  - id: low_colorfulness
    severity: low
    when: "color_colorfulness_score < 20"
    impact: "min(1, (20 - color_colorfulness_score) / 20 + 0.2)"
    message: 'The palette is muted ({color_colorfulness_score:.0f} of 100 on colourfulness). One saturated accent colour would help it stand out in a feed of other thumbnails.'
